name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Tulis project
        run: |
          set -e
          mkdir -p src && cd src
          mkdir -p "$(dirname 'app/build.gradle.kts')"
          cat > 'app/build.gradle.kts' <<'GHEOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.voicescreen"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.voicescreen"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.camera:camera-core:1.3.4")
              implementation("androidx.camera:camera-camera2:1.3.4")
              implementation("androidx.camera:camera-lifecycle:1.3.4")
              implementation("androidx.lifecycle:lifecycle-service:2.8.4")
              implementation("com.google.mlkit:face-detection:16.1.7")
          }
          GHEOF
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          cat > 'app/src/main/AndroidManifest.xml' <<'GHEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_CAMERA" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-feature android:name="android.hardware.camera.front" android:required="false" />
              <queries>
                  <intent><action android:name="android.speech.RecognitionService" /></intent>
              </queries>
              <application
                  android:label="Voice Screen"
                  android:theme="@android:style/Theme.DeviceDefault.Light">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".FloatingMenuService" android:exported="false" />
                  <service
                      android:name=".FaceGestureService"
                      android:exported="false"
                      android:foregroundServiceType="camera" />
                  <service
                      android:name=".ScreenService"
                      android:exported="false"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          GHEOF
          mkdir -p "$(dirname 'app/src/main/java/com/example/voicescreen/MainActivity.kt')"
          cat > 'app/src/main/java/com/example/voicescreen/MainActivity.kt' <<'GHEOF'
          package com.example.voicescreen

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.media.AudioManager
          import android.net.Uri
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView

          class MainActivity : Activity() {

              private var recognizer: SpeechRecognizer? = null
              private var listening = false
              private val handler = Handler(Looper.getMainLooper())
              private lateinit var status: TextView
              private lateinit var toggle: Button
              private lateinit var audio: AudioManager

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  audio = getSystemService(AUDIO_SERVICE) as AudioManager
                  status = TextView(this).apply { text = "Belum mendengarkan"; textSize = 18f; gravity = Gravity.CENTER }
                  val access = Button(this).apply {
                      text = "1. Aktifkan Aksesibilitas"
                      setOnClickListener { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) }
                  }
                  toggle = Button(this).apply {
                      text = "2. Mulai Dengarkan"
                      setOnClickListener { if (listening) stop() else start() }
                  }
                  val floating = Button(this).apply {
                      text = "3. Tombol Melayang"
                      setOnClickListener {
                          if (!Settings.canDrawOverlays(this@MainActivity)) {
                              startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                          } else {
                              startService(Intent(this@MainActivity, FloatingMenuService::class.java))
                          }
                      }
                  }
                  val face = Button(this).apply {
                      text = "4. Gestur Wajah (kamera)"
                      setOnClickListener {
                          val need = mutableListOf<String>()
                          if (checkSelfPermission(Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) need.add(Manifest.permission.CAMERA)
                          if (android.os.Build.VERSION.SDK_INT >= 33 &&
                              checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                              need.add(Manifest.permission.POST_NOTIFICATIONS)
                          }
                          if (need.isNotEmpty()) {
                              requestPermissions(need.toTypedArray(), 2)
                          } else {
                              startForegroundService(Intent(this@MainActivity, FaceGestureService::class.java))
                              status.text = "Gestur wajah aktif: kedip = kunci layar, tengok atas/bawah = scroll"
                          }
                      }
                  }
                  setContentView(LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(48, 96, 48, 48)
                      addView(status); addView(access); addView(toggle); addView(floating); addView(face)
                  })
              }

              private fun start() {
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(arrayOf(Manifest.permission.RECORD_AUDIO), 1); return
                  }
                  if (ScreenService.instance == null) {
                      status.text = "Aktifkan dulu 'Voice Screen' di Aksesibilitas"; return
                  }
                  if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                      status.text = "Speech recognition tidak tersedia di HP ini"; return
                  }
                  listening = true
                  toggle.text = "Stop Dengarkan"
                  muteBeeps()
                  recognizer = SpeechRecognizer.createSpeechRecognizer(this).apply {
                      setRecognitionListener(object : RecognitionListener {
                          override fun onResults(r: Bundle?) {
                              val text = r?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull().orEmpty()
                              val aksi = ScreenService.instance?.handle(text)
                              status.text = "\"$text\"\n→ ${aksi ?: "perintah tidak dikenal"}"
                              again()
                          }
                          override fun onError(e: Int) { again() }
                          override fun onReadyForSpeech(p: Bundle?) { status.text = "Mendengarkan..." }
                          override fun onBeginningOfSpeech() {}
                          override fun onRmsChanged(v: Float) {}
                          override fun onBufferReceived(b: ByteArray?) {}
                          override fun onEndOfSpeech() {}
                          override fun onPartialResults(p: Bundle?) {}
                          override fun onEvent(t: Int, p: Bundle?) {}
                      })
                  }
                  listen()
              }

              private fun listen() {
                  val i = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE, "id-ID")
                      // Kasih waktu lebih lama sebelum dianggap "selesai bicara" atau
                      // "tidak ada suara", biar ucapan pelan/kecil gak keburu dipotong.
                      putExtra(RecognizerIntent.EXTRA_SPEECH_INPUT_COMPLETE_SILENCE_LENGTH_MILLIS, 1500L)
                      putExtra(RecognizerIntent.EXTRA_SPEECH_INPUT_POSSIBLY_COMPLETE_SILENCE_LENGTH_MILLIS, 1500L)
                      putExtra(RecognizerIntent.EXTRA_SPEECH_INPUT_MINIMUM_LENGTH_MILLIS, 4000L)
                  }
                  recognizer?.startListening(i)
              }

              private fun again() { if (listening) handler.postDelayed({ listen() }, 120) }

              private fun stop() {
                  listening = false
                  recognizer?.destroy(); recognizer = null
                  toggle.text = "2. Mulai Dengarkan"
                  status.text = "Berhenti"
                  unmuteBeeps()
              }

              // Beep speech recognizer beda-beda device kadang lewat stream MUSIC,
              // kadang NOTIFICATION/SYSTEM. Mute semuanya, lewati yang gak diizinkan.
              private val beepStreams = intArrayOf(
                  AudioManager.STREAM_MUSIC,
                  AudioManager.STREAM_NOTIFICATION,
                  AudioManager.STREAM_SYSTEM
              )

              private fun muteBeeps() {
                  for (s in beepStreams) {
                      try { audio.adjustStreamVolume(s, AudioManager.ADJUST_MUTE, 0) } catch (_: SecurityException) {}
                  }
              }

              private fun unmuteBeeps() {
                  for (s in beepStreams) {
                      try { audio.adjustStreamVolume(s, AudioManager.ADJUST_UNMUTE, 0) } catch (_: SecurityException) {}
                  }
              }

              override fun onRequestPermissionsResult(c: Int, p: Array<out String>, r: IntArray) {
                  if (c == 1 && r.firstOrNull() == PackageManager.PERMISSION_GRANTED) start()
                  if (c == 2 && r.isNotEmpty() && r.all { it == PackageManager.PERMISSION_GRANTED }) {
                      startForegroundService(Intent(this, FaceGestureService::class.java))
                      status.text = "Gestur wajah aktif: kedip = kunci layar, tengok atas/bawah = scroll"
                  }
              }

              override fun onDestroy() { stop(); super.onDestroy() }
          }
          GHEOF
          mkdir -p "$(dirname 'app/src/main/java/com/example/voicescreen/ScreenService.kt')"
          cat > 'app/src/main/java/com/example/voicescreen/ScreenService.kt' <<'GHEOF'
          package com.example.voicescreen

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.graphics.Path
          import android.media.AudioManager
          import android.os.Handler
          import android.os.Looper
          import android.view.accessibility.AccessibilityEvent

          class ScreenService : AccessibilityService() {

              companion object { var instance: ScreenService? = null }

              private val handler = Handler(Looper.getMainLooper())

              override fun onServiceConnected() { instance = this }
              override fun onAccessibilityEvent(e: AccessibilityEvent?) {}
              override fun onInterrupt() {}
              override fun onUnbind(intent: android.content.Intent?): Boolean {
                  instance = null
                  return super.onUnbind(intent)
              }

              /**
               * Perintah huruf tunggal (a-s), dicocokkan PERSIS.
               * a=naik b=turun c=kiri d=kanan e=tap f=dobel g=tahan h=balik i=rumah
               * j=baru k=bel l=tutup m=kunci n=jepret o=kilat p=daya q=keras r=pelan s=bisu
               */
              fun handle(raw: String): String? {
                  val cmd = raw.lowercase().trim()
                  val am = getSystemService(AUDIO_SERVICE) as? AudioManager
                  return when (cmd) {
                      "a" -> { swipe(.5f, .25f, .5f, .75f); "Scroll atas" }
                      "b" -> { swipe(.5f, .75f, .5f, .25f); "Scroll bawah" }
                      "c" -> { swipe(.2f, .5f, .8f, .5f); "Geser kiri" }
                      "d" -> { swipe(.8f, .5f, .2f, .5f); "Geser kanan" }
                      "e" -> { tap(.5f, .5f); "Tap tengah" }
                      "f" -> { doubleTap(.5f, .5f); "Tap dua kali" }
                      "g" -> { longPress(.5f, .5f); "Tekan lama" }
                      "h" -> { performGlobalAction(GLOBAL_ACTION_BACK); "Kembali" }
                      "i" -> { performGlobalAction(GLOBAL_ACTION_HOME); "Home" }
                      "j" -> { performGlobalAction(GLOBAL_ACTION_RECENTS); "Recent" }
                      "k" -> { performGlobalAction(GLOBAL_ACTION_NOTIFICATIONS); "Notifikasi" }
                      "l" -> { performGlobalAction(GLOBAL_ACTION_DISMISS_NOTIFICATION_SHADE); "Tutup notifikasi" }
                      "m" -> { performGlobalAction(GLOBAL_ACTION_LOCK_SCREEN); "Kunci layar" }
                      "n" -> { performGlobalAction(GLOBAL_ACTION_TAKE_SCREENSHOT); "Screenshot" }
                      "o" -> { performGlobalAction(GLOBAL_ACTION_QUICK_SETTINGS); "Quick settings" }
                      "p" -> { performGlobalAction(GLOBAL_ACTION_POWER_DIALOG); "Power dialog" }
                      "q" -> {
                          am?.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_RAISE, AudioManager.FLAG_SHOW_UI)
                          "Volume naik"
                      }
                      "r" -> {
                          am?.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_LOWER, AudioManager.FLAG_SHOW_UI)
                          "Volume turun"
                      }
                      "s" -> {
                          am?.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_TOGGLE_MUTE, AudioManager.FLAG_SHOW_UI)
                          "Mute/unmute volume"
                      }
                      else -> null
                  }
              }

              private fun swipe(x1: Float, y1: Float, x2: Float, y2: Float) {
                  val m = resources.displayMetrics
                  val p = Path().apply {
                      moveTo(m.widthPixels * x1, m.heightPixels * y1)
                      lineTo(m.widthPixels * x2, m.heightPixels * y2)
                  }
                  dispatchGesture(
                      GestureDescription.Builder()
                          .addStroke(GestureDescription.StrokeDescription(p, 0, 350)).build(),
                      null, null
                  )
              }

              private fun tap(x: Float, y: Float) {
                  val m = resources.displayMetrics
                  val p = Path().apply { moveTo(m.widthPixels * x, m.heightPixels * y) }
                  dispatchGesture(
                      GestureDescription.Builder()
                          .addStroke(GestureDescription.StrokeDescription(p, 0, 50)).build(),
                      null, null
                  )
              }

              private fun doubleTap(x: Float, y: Float) {
                  tap(x, y)
                  handler.postDelayed({ tap(x, y) }, 150)
              }

              private fun longPress(x: Float, y: Float) {
                  val m = resources.displayMetrics
                  val p = Path().apply { moveTo(m.widthPixels * x, m.heightPixels * y) }
                  dispatchGesture(
                      GestureDescription.Builder()
                          .addStroke(GestureDescription.StrokeDescription(p, 0, 700)).build(),
                      null, null
                  )
              }
          }
          GHEOF
          mkdir -p "$(dirname 'app/src/main/java/com/example/voicescreen/FloatingMenuService.kt')"
          cat > 'app/src/main/java/com/example/voicescreen/FloatingMenuService.kt' <<'GHEOF'
          package com.example.voicescreen

          import android.app.Service
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.os.Build
          import android.os.IBinder
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.WindowManager
          import android.widget.Button
          import android.widget.GridLayout
          import android.widget.TextView

          class FloatingMenuService : Service() {

              private lateinit var wm: WindowManager
              private var bubble: TextView? = null
              private var panel: GridLayout? = null
              private var bubbleParams: WindowManager.LayoutParams? = null

              private val overlayType =
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O)
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                  else
                      @Suppress("DEPRECATION") WindowManager.LayoutParams.TYPE_PHONE

              private val commands = listOf(
                  "A naik" to "a", "B turun" to "b", "C kiri" to "c", "D kanan" to "d",
                  "E tap" to "e", "F dobel" to "f", "G tahan" to "g",
                  "H balik" to "h", "I rumah" to "i", "J baru" to "j",
                  "K bel" to "k", "L tutup" to "l", "M kunci" to "m",
                  "N jep
